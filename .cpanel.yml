---
deployment:
  tasks:
    - export REPOPATH=$PWD
    - export DEPLOYPATH=$HOME/vmfoodimport.com
    - /bin/sh -c 'ARTIFACT_SRC=""; NODE_BIN=$(ls -d /opt/cpanel/ea-nodejs*/bin 2>/dev/null | sort -V | tail -n1); if [ -n "$NODE_BIN" ]; then export PATH="$NODE_BIN:$PATH"; echo "Using node from: $NODE_BIN"; node -v; npm -v; npm ci --no-audit --no-fund; npm run build; [ -f dist/app/browser/index.html ] || { echo "Build no genero dist/app/browser/index.html"; exit 1; }; ARTIFACT_SRC="dist/app/browser"; else echo "No hay ea-nodejs disponible; usando artefacto versionado deploy/browser"; [ -f deploy/browser/index.html ] || { echo "Falta deploy/browser/index.html y no se pudo compilar"; exit 1; }; ARTIFACT_SRC="deploy/browser"; fi; echo "$ARTIFACT_SRC" > .cpanel_artifact_src'
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/sh -c 'find "$DEPLOYPATH" -maxdepth 1 -type f \( -name "main-*.js" -o -name "styles-*.css" -o -name "polyfills-*.js" -o -name "index*.html" \) -delete'
    - /bin/sh -c 'ARTIFACT_SRC=$(cat .cpanel_artifact_src); if command -v rsync >/dev/null 2>&1; then rsync -a --delete "$ARTIFACT_SRC"/ "$DEPLOYPATH"/; else cp -R "$ARTIFACT_SRC"/. "$DEPLOYPATH"/; fi'
    - /bin/sh -c 'ARTIFACT_SRC=$(cat .cpanel_artifact_src); LOCAL_MAIN=$(grep -Eo "main-[A-Z0-9]+\\.js" "$ARTIFACT_SRC/index.html" | head -n1); DEPLOY_MAIN=$(grep -Eo "main-[A-Z0-9]+\\.js" "$DEPLOYPATH/index.html" | head -n1); echo "deploy-verify local=$LOCAL_MAIN deployed=$DEPLOY_MAIN"; [ -n "$LOCAL_MAIN" ] && [ "$LOCAL_MAIN" = "$DEPLOY_MAIN" ] || { echo "Deploy verification failed: index en destino no coincide con build actual"; exit 1; }'
    - /bin/sh -c 'echo "$(date +"%Y-%m-%d %H:%M:%S") | $(git rev-parse --short HEAD) | frontend deploy ok" >> $HOME/deploy-frontend.log'
