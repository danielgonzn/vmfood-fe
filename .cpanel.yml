---
deployment:
  tasks:
    - export REPOPATH=$PWD
    - export DEPLOYPATH=$HOME/vmfoodimport.com
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R deploy/browser/. $DEPLOYPATH/
    - /bin/sh -c 'echo "$(date +"%Y-%m-%d %H:%M:%S") | $(git rev-parse --short HEAD) | frontend deploy ok" >> $HOME/deploy-frontend.log'
